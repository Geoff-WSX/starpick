# Windows 安装包 CI 构建（STARPICK 拾星）
#
# 触发：push 到 packaging/、backend/、frontend/ 相关文件，或手动 workflow_dispatch。
# 产物：StarPick-1.0.0-setup.exe + selftest-report.txt（Actions artifacts，保留 14 天）。
# 正式发布：打 tag v* 时构建并直接上传到 GitHub Release（见 upload_release job）。
name: build-windows

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"
      - "frontend/**"
      - "packaging/**"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（默认 1.0.0）"
        required: false
        default: "1.0.0"
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "packaging/**"

permissions:
  contents: write   # tag 触发时上传 Release 需要

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建并自检 + Inno Setup 打包
        shell: pwsh
        run: packaging/windows/build_windows.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: StarPick-windows-setup
          path: |
            packaging/dist/windows/StarPick-*-setup.exe
            packaging/dist/windows/selftest-report.txt
          retention-days: 14
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: StarPick-windows-setup
          path: dist

      - name: 上传到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StarPick-*-setup.exe
          fail_on_unmatched_files: true
